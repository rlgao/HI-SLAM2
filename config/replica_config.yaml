Dataset:
  pcd_downsample: 64
  pcd_downsample_init: 32
  adaptive_pointsize: True
  point_size: 0.05
  scale_multiplier: 2.0

Tracking:
  motion_filter:
    thresh: 2.4    # how much motion before considering new keyframe")
    skip_blur: False
  frontend:
    keyframe_thresh: 4.0  # threshold to create a new keyframe")
    frontend_thresh: 16.0 # add edges between frames whithin this distance")
    frontend_window: 25   # frontend optimization window")
    frontend_radius: 2    # force edges between frames within radius")
    frontend_nms: 1       # non-maximal supression of edges")
    mono_depth_alpha: 0.001
    use_scal3r_prior: false
    scal3r_prior:
      active: false
      mode: replace_omnidata_depth
      cache_json: ""
      aligned_depth_dir: ""
      confidence_dir: ""
      dba_depth_dir: ""
      render_depth_dir: ""
      rgb_dir: ""
      depth_source: aligned_depth_dir
      confidence_default: 1.0
      confidence_power: 1.0
      min_confidence: 0.0
      min_confident_pixels: 128
      initialize_dscale: median_ratio
      confidence_weights:
        depth: 1.0
        render: 1.0
        texture: 0.5
      confidence_rel_sigma: 0.1
      render_confidence_rel_sigma: 0.1
      texture_min_grad: 0.02
      texture_max_grad: 0.2
      resize_depth_interpolation: bilinear
      resize_confidence_interpolation: nearest
      missing_policy: fallback_omnidata
      base_dir: ""
  backend:
    backend_thresh: 22.0  # add loop closure edges within this distance (larger is more edges)')
    backend_radius: 2     # connect neighbors within radius (larger is more edges)')
    backend_nms: 3        # non-maximal supression of edges (smaller is more edges)')
    covis_thresh: 0.2
  pgba:
    active: False
    pgba_thresh: 22.0     # add loop closure edges within this distance (larger is more edges)')

Training:
  init_itr_num: 1050
  init_gaussian_update: 100
  init_gaussian_reset: 500
  init_gaussian_th: 0.005
  init_gaussian_extent: 30
  gaussian_update_every: 150
  gaussian_update_offset: 50
  gaussian_th: 0.7
  gaussian_extent: 1.0
  gaussian_reset: 2001
  size_threshold: 20
  window_size: 10
  rgb_boundary_threshold: 0.01
  lambda_dnormal: 0.1
  compensate_exposure: false
  scal3r_gaussian_init:
    active: false
    mode: off
    cache_json: ""
    aligned_depth_dir: ""
    confidence_dir: ""
    dba_depth_dir: ""
    render_depth_dir: ""
    rgb_dir: ""
    pointmap_path: ""
    chunk_id: ""
    depth_source: aligned_depth_dir
    confidence_default: 1.0
    confidence_power: 1.0
    min_confidence: 0.0
    confidence_fusion: false
    confidence_sampling_power: 2.0
    confidence_weights:
      depth: 1.0
      render: 1.0
      texture: 0.5
    confidence_rel_sigma: 0.1
    render_confidence_rel_sigma: 0.1
    texture_min_grad: 0.02
    texture_max_grad: 0.2
    min_confident_pixels: 128
    pointmap_frame: scal3r
    pointmap_max_points: 20000
    pointmap_min_points: 128
    depth_rel_tolerance: 0.25
    allow_missing_depth: true
    min_camera_z: 0.01
    max_camera_z: 100.0
    image_margin: 0
    random_seed: 0
    resize_depth_interpolation: bilinear
    resize_confidence_interpolation: nearest
    missing_policy: fallback_dba
    base_dir: ""

opt_params:
  pose_lr: 0.0001
  position_lr_init: 0.00016
  position_lr_final: 0.0000016
  position_lr_max_steps: 2000
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.001
  rotation_lr: 0.001
  percent_dense: 0.01
  lambda_dssim: 0.2
  densify_grad_threshold: 0.0002
